<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0F1A">
  <title>Pomodoro Timer</title>
  <meta name="description" content="A dark, neon Pomodoro timer with tasks, focus cycles, ambient sounds, and a daily goal.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="pomodoro-timer.css">
</head>
<body>
  <main class="app">
    <header class="top"><h1>Pomodoro<span>.</span></h1><p class="date" id="today"></p></header>

    <div class="grid">
      <section class="card timer-card" aria-label="Timer">
        <div class="modes" role="group" aria-label="Session type">
          <button type="button" class="mode is-active" data-mode="work" data-min="25" aria-pressed="true">Focus</button>
          <button type="button" class="mode" data-mode="shortBreak" data-min="5" aria-pressed="false">Short break</button>
          <button type="button" class="mode" data-mode="longBreak" data-min="15" aria-pressed="false">Long break</button>
        </div>
        <p class="now" id="now">Pick a task, or just start</p>
        <div class="dial">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="s1"/><stop offset="1" class="s2"/></linearGradient></defs>
            <circle class="track" cx="100" cy="100" r="90"/>
            <circle class="bar" id="bar" cx="100" cy="100" r="90" stroke="url(#g)"/>
          </svg>
          <div class="readout"><div class="time" id="timer" role="timer">25:00</div><div class="state" id="state">Ready to focus</div></div>
        </div>
        <div class="dots" id="dots" role="img" aria-label="0 of 4 focus sessions done"><i></i><i></i><i></i><i></i></div>
        <div class="actions">
          <button type="button" class="btn primary" id="startBtn">Start</button>
          <button type="button" class="btn ghost" id="restartBtn">Reset</button>
        </div>
        <div class="length"><label for="timerSlider">Length <output id="lengthOut" for="timerSlider">25 min</output></label>
          <input type="range" id="timerSlider" min="1" max="60" value="25"></div>
        <div class="opts">
          <label class="switch"><input type="checkbox" id="autoStart"><span class="knob"></span>Auto-start next</label>
          <label class="sound">Ambient
            <select id="ambient"><option value="off">Off</option><option value="rain">Rain</option><option value="waves">Waves</option><option value="brown">Brown noise</option></select></label>
        </div>
      </section>

      <div class="side">
        <section class="card" aria-label="Tasks">
          <h2>Tasks</h2>
          <form id="taskForm" class="add"><label class="sr" for="taskInput">New task</label>
            <input id="taskInput" type="text" maxlength="80" placeholder="What are you focusing on?" autocomplete="off">
            <button class="btn small primary" type="submit">Add</button></form>
          <ul class="tasks" id="tasks"></ul>
        </section>
        <section class="card" aria-label="Today">
          <h2>Today</h2>
          <div class="goal"><div class="row"><span>Daily goal</span>
            <span class="stepper"><button type="button" id="goalDown" aria-label="Lower goal">−</button><b id="goalOut">4</b><button type="button" id="goalUp" aria-label="Raise goal">+</button></span></div>
            <div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0" id="meter"><i id="meterFill"></i></div></div>
          <div class="stats">
            <div><span class="k">Sessions</span><span class="v" id="sessions">0</span></div>
            <div><span class="k">Focus time</span><span class="v" id="totalFocusTime">00:00</span></div>
            <div><span class="k">Streak</span><span class="v" id="streak">0 d</span></div>
          </div>
        </section>
      </div>
    </div>
    <p class="sr" id="announce" role="status" aria-live="polite"></p>
  </main>
  <audio id="endSound" src="alarm.mp3" preload="auto"></audio>
  <script src="pomodoro-timer.js"></script>
</body>
</html>
