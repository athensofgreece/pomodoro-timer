<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pomodoro Timer</title>
  <meta name="description" content="A calm Pomodoro timer with focus and break modes, adjustable length, and a running focus-time total.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="pomodoro-timer.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>Pomodoro</h1>
      <button class="icon-btn" id="themeToggle" type="button" aria-label="Switch to dark mode">
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>

    <section class="card" aria-label="Timer">
      <div class="modes" role="group" aria-label="Session type">
        <button type="button" class="mode is-active" data-mode="work" data-min="25" aria-pressed="true">Focus</button>
        <button type="button" class="mode" data-mode="shortBreak" data-min="5" aria-pressed="false">Short break</button>
        <button type="button" class="mode" data-mode="longBreak" data-min="15" aria-pressed="false">Long break</button>
      </div>

      <div class="dial">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <circle class="track" cx="100" cy="100" r="90"/>
          <circle class="bar" id="bar" cx="100" cy="100" r="90"/>
        </svg>
        <div class="readout">
          <div class="time" id="timer" role="timer" aria-live="off">25:00</div>
          <div class="state" id="state">Ready to focus</div>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn primary" id="startBtn">Start</button>
        <button type="button" class="btn ghost" id="restartBtn">Reset</button>
      </div>

      <div class="length">
        <label for="timerSlider">Length <output id="lengthOut" for="timerSlider">25 min</output></label>
        <input type="range" id="timerSlider" min="1" max="60" value="25">
      </div>
    </section>

    <section class="stats" aria-label="Today">
      <div><span class="k">Focus time</span><span class="v" id="totalFocusTime">00:00</span></div>
      <div><span class="k">Sessions done</span><span class="v" id="sessions">0</span></div>
    </section>

    <p class="sr" id="announce" role="status" aria-live="polite"></p>
  </main>

  <audio id="endSound" src="alarm.mp3" preload="auto"></audio>
  <script src="pomodoro-timer.js"></script>
</body>
</html>
